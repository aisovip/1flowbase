name: Gateway target handoff regression

on:
  push:
    branches: [codex/gateway-target-handoff]
  workflow_dispatch:
    inputs:
      verify_callback_attachment:
        description: Verify callback attachment live and durable delivery before building the candidate
        type: boolean
        default: false
      verify_fork_projection:
        description: Verify native fork task projections with real PostgreSQL migrations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gateway-target-handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gateway-fixture
          POSTGRES_DB: gateway_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:gateway-fixture@127.0.0.1:5432/gateway_fixture
      API_DATABASE_URL: postgres://postgres:gateway-fixture@127.0.0.1:5432/gateway_fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: gateway-target-handoff
          cache-on-failure: true
          workspaces: api -> target
      - name: Resolve source and repository resources
        run: |
          mkdir -p tmp/test-governance/gateway-target-handoff/ci
          git rev-parse HEAD > tmp/test-governance/gateway-target-handoff/ci/source-sha.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Registry settlement, fencing and existing transport invariants
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p orchestration-runtime transport_session > tmp/test-governance/gateway-target-handoff/ci/registry.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/registry.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/registry.log
      - name: Coordinator target handoff and existing lifecycle regressions
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib provider_runtime::transport_session_lifecycle > tmp/test-governance/gateway-target-handoff/ci/coordinator.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/coordinator.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/coordinator.log
      - name: Callback admission ownership and recovery regressions
        if: ${{ !cancelled() && inputs.verify_callback_attachment }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib application_public_api::resume > tmp/test-governance/gateway-target-handoff/ci/callback-admission.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/callback-admission.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/callback-admission.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib application_public_api::native_tool_resume > tmp/test-governance/gateway-target-handoff/ci/native-tool-resume.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/native-tool-resume.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/native-tool-resume.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration callback_resume > tmp/test-governance/gateway-target-handoff/ci/postgres-callback.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/postgres-callback.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/postgres-callback.log
      - name: Callback execution ownership and port contracts
        if: ${{ !cancelled() && inputs.verify_callback_attachment }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib application_public_api::callback_resume::prepared::tests > tmp/test-governance/gateway-target-handoff/ci/prepared-callback.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/prepared-callback.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/prepared-callback.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib orchestration_runtime::callback_completion > tmp/test-governance/gateway-target-handoff/ci/callback-execution.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/callback-execution.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/callback-execution.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts > tmp/test-governance/gateway-target-handoff/ci/callback-contracts.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/callback-contracts.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/callback-contracts.log
      - name: Callback attachment live and durable delivery regressions
        if: ${{ !cancelled() && inputs.verify_callback_attachment }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib routes::application_public_api::compat_sse::tests::forwarding > tmp/test-governance/gateway-target-handoff/ci/callback-forwarding.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/callback-forwarding.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/callback-forwarding.log
      - name: Runtime event generation retirement regressions
        if: ${{ !cancelled() && inputs.verify_callback_attachment }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib _tests::runtime_event_stream > tmp/test-governance/gateway-target-handoff/ci/runtime-event-stream.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/runtime-event-stream.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/runtime-event-stream.log
      - name: Build candidate API for task-owned runtime verification
        run: |
          cargo build --locked --manifest-path api/Cargo.toml -p api-server --bin api-server --features tikv-jemallocator/stats > tmp/test-governance/gateway-target-handoff/ci/build.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/build.log; exit 1; }
          cp api/target/debug/api-server tmp/test-governance/gateway-target-handoff/ci/api-server
          sha256sum tmp/test-governance/gateway-target-handoff/ci/api-server > tmp/test-governance/gateway-target-handoff/ci/api-server.sha256
      - name: Nullable Responses continuation cursor contract
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane nullable_previous_response_id > tmp/test-governance/gateway-target-handoff/ci/nullable-cursor.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/nullable-cursor.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/nullable-cursor.log
      - name: Native fork visibility, child boundaries and populated migration
        if: ${{ inputs.verify_fork_projection }}
        run: |
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration application_logs::task_projection > tmp/test-governance/gateway-target-handoff/ci/fork-projection.log 2>&1 || { tail -c 6000 tmp/test-governance/gateway-target-handoff/ci/fork-projection.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/gateway-target-handoff/ci/fork-projection.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gateway-target-handoff-evidence
          path: tmp/test-governance/gateway-target-handoff/ci
